name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile (windows/darwin)
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/private-gateway/
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/private-gateway/
